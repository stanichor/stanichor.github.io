<nav style="background-color: #f6f8fa; border-bottom: 1px solid #d1d5da; padding: 16px 0; margin-bottom: 32px;">
  <div class="site-nav-inner" style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px;">
    <a href="{{ '/' | relative_url }}" style="font-weight: 600; color: #0366d6; text-decoration: none; margin-right: auto;">{{ site.title }}</a>
    <div style="display: flex; flex-wrap: wrap; gap: 12px 24px;">
      {% for item in site.navigation %}
        <a href="{{ item.url | relative_url }}" style="color: #586069; text-decoration: none; font-weight: 500;">{{ item.text }}</a>
      {% endfor %}
    </div>
  </div>
</nav>
