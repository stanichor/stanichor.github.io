<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

{% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/layout.css' | relative_url }}">
    {% if page.url == '/' %}
    <link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}">
    {% endif %}
    {% include head-custom.html %}
  </head>
  <body{% if page.url == '/' %} class="home-page"{% endif %}>
    <div class="site-header markdown-body">
      {% include header.html %}
    </div>
    <div class="site-content my-5 markdown-body{% if page.url == '/' %} home-index{% endif %}">
      {{ content }}
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/anchor-js/4.1.0/anchor.min.js" integrity="sha256-lZaRhKri35AyJSypXXs4o6OPFTbTmUoltBbDCbdzegg=" crossorigin="anonymous"></script>
    <script>anchors.add();</script>
  </body>
</html>
