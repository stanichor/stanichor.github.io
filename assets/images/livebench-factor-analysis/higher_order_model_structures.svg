<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1170" role="img" aria-labelledby="title description">
  <title id="title">Three higher-order structures for the seven LiveBench task factors</title>
  <desc id="description">Top: one general factor loads on all seven task factors. Middle: Coding, Language, and Instruction Following domain factors load on their respective tasks and correlate freely with one another. Bottom: one grand factor loads on those three domains, which in turn load on their respective tasks. Every task factor still loads on its own items, omitted here.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="context-stroke"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #1e293b; }
      .panel { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; }
      .heading { font-size: 24px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #475569; }
      .task { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
      .task-label { font-size: 18px; font-weight: 600; }
      .factor-label { font-size: 19px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .general { fill: #f4f0ff; stroke: #7c3aed; stroke-width: 2; }
      .coding { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .language { fill: #ecfdf5; stroke: #16a34a; stroke-width: 2; }
      .instruction { fill: #fff7ed; stroke: #d97706; stroke-width: 2; }
      .loading { fill: none; stroke: #64748b; stroke-width: 2.2; marker-end: url(#arrow); }
      .correlation { fill: none; stroke: #9566bc; stroke-width: 2.4; stroke-dasharray: 7 5; }
    </style>
    <g id="task-list">
      <rect class="task" x="0" y="0" width="325" height="32" rx="7"/>
      <text class="task-label" x="13" y="22">LCB Generation</text>
      <rect class="task" x="0" y="38" width="325" height="32" rx="7"/>
      <text class="task-label" x="13" y="60">Coding Completion</text>
      <rect class="task" x="0" y="76" width="325" height="32" rx="7"/>
      <text class="task-label" x="13" y="98">Connections</text>
      <rect class="task" x="0" y="114" width="325" height="32" rx="7"/>
      <text class="task-label" x="13" y="136">Plot Unscrambling</text>
      <rect class="task" x="0" y="152" width="325" height="32" rx="7"/>
      <text class="task-label" x="13" y="174">Typos</text>
      <rect class="task" x="0" y="190" width="325" height="32" rx="7"/>
      <text class="task-label" x="13" y="212">Paraphrase</text>
      <rect class="task" x="0" y="228" width="325" height="32" rx="7"/>
      <text class="task-label" x="13" y="250">Story Generation</text>
    </g>
  </defs>

  <rect width="1000" height="1170" fill="#fff"/>

  <!-- One factor above the seven task factors. -->
  <rect class="panel" x="10" y="10" width="980" height="370" rx="15"/>
  <text class="heading" x="34" y="47">A · Single higher-order factor</text>
  <text class="subtitle" x="34" y="73">One general factor explains correlations among all seven task factors.</text>
  <path class="loading" d="M450 206L636 116"/>
  <path class="loading" d="M450 214L636 154"/>
  <path class="loading" d="M450 222L636 192"/>
  <path class="loading" d="M450 230L636 230"/>
  <path class="loading" d="M450 238L636 268"/>
  <path class="loading" d="M450 246L636 306"/>
  <path class="loading" d="M450 254L636 344"/>
  <rect class="general" x="210" y="202" width="240" height="56" rx="13"/>
  <text class="factor-label" x="330" y="230">General factor</text>
  <use href="#task-list" transform="translate(640 100)"/>

  <!-- Three freely correlated domains above the same seven task factors. -->
  <rect class="panel" x="10" y="400" width="980" height="370" rx="15"/>
  <text class="heading" x="34" y="437">B · Correlated domain factors</text>
  <text class="subtitle" x="34" y="463">The three domains correlate freely and each explains its own tasks.</text>
  <path class="correlation" d="M275 525C165 525 165 620 275 620 M275 620C165 620 165 715 275 715 M275 525C80 525 80 715 275 715"/>
  <path class="loading" d="M505 518L636 506"/>
  <path class="loading" d="M505 532L636 544"/>
  <path class="loading" d="M505 606L636 582"/>
  <path class="loading" d="M505 620L636 620"/>
  <path class="loading" d="M505 634L636 658"/>
  <path class="loading" d="M505 708L636 696"/>
  <path class="loading" d="M505 722L636 734"/>
  <rect class="coding" x="275" y="500" width="230" height="50" rx="12"/>
  <text class="factor-label" x="390" y="525">Coding</text>
  <rect class="language" x="275" y="595" width="230" height="50" rx="12"/>
  <text class="factor-label" x="390" y="620">Language</text>
  <rect class="instruction" x="275" y="690" width="230" height="50" rx="12"/>
  <text class="factor-label" x="390" y="715">Instruction Following</text>
  <use href="#task-list" transform="translate(640 490)"/>

  <!-- A grand factor explains correlations among the three domains. -->
  <rect class="panel" x="10" y="790" width="980" height="370" rx="15"/>
  <text class="heading" x="34" y="827">C · Grand factor over domains</text>
  <text class="subtitle" x="34" y="853">A grand factor explains the domains’ correlations; domains explain their tasks.</text>
  <path class="loading" d="M260 995L320 915"/>
  <path class="loading" d="M260 1010L320 1010"/>
  <path class="loading" d="M260 1025L320 1105"/>
  <path class="loading" d="M530 908L636 896"/>
  <path class="loading" d="M530 922L636 934"/>
  <path class="loading" d="M530 996L636 972"/>
  <path class="loading" d="M530 1010L636 1010"/>
  <path class="loading" d="M530 1024L636 1048"/>
  <path class="loading" d="M530 1098L636 1086"/>
  <path class="loading" d="M530 1112L636 1124"/>
  <rect class="general" x="90" y="983" width="170" height="54" rx="13"/>
  <text class="factor-label" x="175" y="1010">Grand factor</text>
  <rect class="coding" x="320" y="890" width="210" height="50" rx="12"/>
  <text class="factor-label" x="425" y="915">Coding</text>
  <rect class="language" x="320" y="985" width="210" height="50" rx="12"/>
  <text class="factor-label" x="425" y="1010">Language</text>
  <rect class="instruction" x="320" y="1080" width="210" height="50" rx="12"/>
  <text class="factor-label" x="425" y="1105">Instruction Following</text>
  <use href="#task-list" transform="translate(640 880)"/>
</svg>
